apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-customer-service
  labels:
    app: redis-customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-customer-service
  template:
    metadata:
      labels:
        app: redis-customer-service
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "neocentra_redis_secret_2026"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-customer-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-customer-service
